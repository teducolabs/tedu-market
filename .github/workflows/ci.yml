name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit mới khớp T<số>
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="origin/${{ github.base_ref }}..HEAD"; else range="${{ github.event.before }}..${{ github.sha }}"; fi
          bad=$(git log --format=%s "$range" --no-merges | grep -vE '^T[0-9]+: .{5,72}$' || true)
          if [ -n "$bad" ]; then echo "Commit sai định dạng:"; echo "$bad"; exit 1; fi
      - name: TODO/FIXME phải có mã thẻ
        run: |
          bad=$(git grep -nE 'TODO|FIXME' -- ':!docs' ':!.github' ':!pnpm-lock.yaml' ':!eslint.config.js' ':!AGENTS.md' ':!CLAUDE.md' | grep -vE '\(T[0-9]+\)' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm turbo test
      - run: pnpm turbo build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet format backend/TeduMarket.slnx --verify-no-changes
      - run: dotnet build backend/TeduMarket.slnx -warnaserror
      - run: >
          dotnet test backend/TeduMarket.slnx --no-build --filter Category=Unit
          --settings backend/coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory coverage
      - name: Coverage Domain + Application >= 70%
        run: python3 .github/scripts/check_coverage.py coverage 70

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/TeduMarket.slnx --filter Category=Integration

  build:
    # Chỉ sau khi merge master; PR chỉ chạy các tầng kiểm tra (deploy.md mục 4).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [conventions, frontend, unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: api, file: backend/Dockerfile, target: api }
          - { image: migrator, file: backend/Dockerfile, target: migrator }
          - { image: web, file: apps/student-web/Dockerfile, target: web }
          - { image: admin, file: apps/admin-app/Dockerfile, target: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tên image viết thường
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/tedu-market-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
