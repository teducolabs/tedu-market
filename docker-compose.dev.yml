# Hạ tầng chạy local: PostgreSQL 18, MinIO, Seq. Giá trị bí mật lấy từ .env.local (không commit).
# Chạy: docker compose --env-file .env.local -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tedu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env.local}
      POSTGRES_DB: tedu_market
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedu -d tedu_market"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: chainguard/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Thiếu MINIO_ACCESS_KEY trong .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Thiếu MINIO_SECRET_KEY trong .env.local}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Tạo bucket thumbnail rồi cho đọc ẩn danh (ảnh hiển thị công khai); mỗi service chạy xong thì thoát, chạy lại không lỗi.
  # Image không có shell nên truyền kết nối bằng MC_HOST_local; restart on-failure để đợi MinIO sẵn sàng.
  minio-bucket:
    image: chainguard/minio-client
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY:?Thiếu MINIO_ACCESS_KEY trong .env.local}:${MINIO_SECRET_KEY:?Thiếu MINIO_SECRET_KEY trong .env.local}@minio:9000
    command: ["mb", "--ignore-existing", "local/thumbnails"]

  minio-policy:
    image: chainguard/minio-client
    depends_on:
      minio-bucket:
        condition: service_completed_successfully
    restart: "no"
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY:?Thiếu MINIO_ACCESS_KEY trong .env.local}:${MINIO_SECRET_KEY:?Thiếu MINIO_SECRET_KEY trong .env.local}@minio:9000
    command: ["anonymous", "set", "download", "local/thumbnails"]

  seq:
    image: datalust/seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5340:80"
      - "127.0.0.1:5341:5341"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  minio-data:
  seq-data:
